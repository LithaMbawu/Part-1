<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RaceDay ERD</title>
<style>
@page { size: A4 landscape; margin: 12mm; }
body { margin: 0; font: 11px Arial, sans-serif; color: #14212b; }
h1 { margin: 0 0 4px; font-size: 22px; }
.key { margin: 0 0 8px; color: #52616b; }
svg { width: 100%; height: 170mm; border: 1px solid #b9c5cb; }
.entity { fill: #f7fafb; stroke: #1d4f60; stroke-width: 1.5; }
.head { fill: #1d4f60; }
.headtext { fill: white; font-weight: bold; }
.field { fill: #14212b; font-size: 10px; }
.rel { stroke: #52616b; stroke-width: 1.2; fill: none; }
.card { fill: #52616b; font-size: 9px; }
</style>
</head>
<body>
<h1>RaceDay Entity Relationship Diagram</h1>
<p class="key">PK = primary key | FK = foreign key | UK = unique key | Cardinalities are shown at relationship ends.</p>
<svg viewBox="0 0 1100 650" role="img" aria-label="RaceDay database entity relationship diagram">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52616b"/></marker></defs>
<g transform="translate(30 90)"><rect class="entity" width="250" height="235" rx="2"/><rect class="head" width="250" height="30"/><text class="headtext" x="12" y="20">USERS</text><text class="field" x="12" y="52">PK UserId INT IDENTITY</text><text class="field" x="12" y="74">FirstName NVARCHAR(60) NOT NULL</text><text class="field" x="12" y="96">LastName NVARCHAR(60) NOT NULL</text><text class="field" x="12" y="118">UK Email NVARCHAR(320)</text><text class="field" x="12" y="140">PasswordHash NVARCHAR(255)</text><text class="field" x="12" y="162">Role NVARCHAR(20)</text><text class="field" x="12" y="184">Phone NVARCHAR(30) NULL</text><text class="field" x="12" y="206">CreatedAt DATETIME2</text></g>
<g transform="translate(420 60)"><rect class="entity" width="270" height="235" rx="2"/><rect class="head" width="270" height="30"/><text class="headtext" x="12" y="20">EVENTS</text><text class="field" x="12" y="52">PK EventId INT IDENTITY</text><text class="field" x="12" y="74">FK OrganiserId INT NOT NULL</text><text class="field" x="12" y="96">Name NVARCHAR(120) NOT NULL</text><text class="field" x="12" y="118">Description NVARCHAR(1000) NULL</text><text class="field" x="12" y="140">EventDate DATETIME2(0) NOT NULL</text><text class="field" x="12" y="162">Venue NVARCHAR(200) NOT NULL</text><text class="field" x="12" y="184">Capacity INT NOT NULL</text><text class="field" x="12" y="206">Status NVARCHAR(20) NOT NULL</text><text class="field" x="12" y="228">CreatedAt DATETIME2(0) NOT NULL</text></g>
<g transform="translate(820 60)"><rect class="entity" width="240" height="120" rx="2"/><rect class="head" width="240" height="30"/><text class="headtext" x="12" y="20">CATEGORIES</text><text class="field" x="12" y="52">PK CategoryId INT IDENTITY</text><text class="field" x="12" y="74">UK Name NVARCHAR(80)</text><text class="field" x="12" y="96">Description NVARCHAR(500)</text></g>
<g transform="translate(420 375)"><rect class="entity" width="270" height="130" rx="2"/><rect class="head" width="270" height="30"/><text class="headtext" x="12" y="20">EVENT_CATEGORIES</text><text class="field" x="12" y="52">PK/FK EventId INT</text><text class="field" x="12" y="74">PK/FK CategoryId INT</text><text class="field" x="12" y="96">EntryFee DECIMAL(10,2)</text><text class="field" x="12" y="118">PK = EventId + CategoryId</text></g>
<g transform="translate(30 405)"><rect class="entity" width="290" height="205" rx="2"/><rect class="head" width="290" height="30"/><text class="headtext" x="12" y="20">ENROLMENTS</text><text class="field" x="12" y="52">PK EnrolmentId INT IDENTITY</text><text class="field" x="12" y="74">FK EventId INT NOT NULL</text><text class="field" x="12" y="96">FK ParticipantId INT NOT NULL</text><text class="field" x="12" y="118">FK CategoryId INT NOT NULL</text><text class="field" x="12" y="140">EnrolledAt DATETIME2(0) NOT NULL</text><text class="field" x="12" y="162">Status NVARCHAR(20) NOT NULL</text><text class="field" x="12" y="184">UK BibNumber INT NULL</text></g>
<g transform="translate(820 380)"><rect class="entity" width="240" height="175" rx="2"/><rect class="head" width="240" height="30"/><text class="headtext" x="12" y="20">RESULTS</text><text class="field" x="12" y="52">PK ResultId INT IDENTITY</text><text class="field" x="12" y="74">UK/FK EnrolmentId INT NOT NULL</text><text class="field" x="12" y="96">Position INT NULL</text><text class="field" x="12" y="118">FinishTimeSeconds INT NULL</text><text class="field" x="12" y="140">Status NVARCHAR(20) NOT NULL</text><text class="field" x="12" y="162">RecordedAt DATETIME2(0) NOT NULL</text></g>
<path class="rel" marker-end="url(#arrow)" d="M280 180 L420 175"/><text class="card" x="290" y="168">1</text><text class="card" x="380" y="168">0..*</text>
<path class="rel" marker-end="url(#arrow)" d="M420 245 L320 450"/><text class="card" x="397" y="255">1</text><text class="card" x="335" y="430">0..*</text>
<path class="rel" marker-end="url(#arrow)" d="M555 295 L555 375"/><text class="card" x="565" y="315">1</text><text class="card" x="565" y="365">0..*</text>
<path class="rel" marker-end="url(#arrow)" d="M820 115 L690 150"/><text class="card" x="790" y="112">0..*</text><text class="card" x="700" y="143">1</text>
<path class="rel" marker-end="url(#arrow)" d="M820 150 L690 420"/><text class="card" x="790" y="160">0..*</text><text class="card" x="700" y="408">1</text>
<path class="rel" marker-end="url(#arrow)" d="M320 500 L820 450"/><text class="card" x="330" y="490">0..*</text><text class="card" x="785" y="440">1</text>
<path class="rel" marker-end="url(#arrow)" d="M690 440 L820 440"/><text class="card" x="700" y="430">1</text><text class="card" x="780" y="430">0..1</text>
<text class="card" x="350" y="625">Users organise Events | Events and Categories are many-to-many via EventCategories | Users make Enrolments | Enrolments produce zero or one Result</text>
</svg>
</body>
</html>
