name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish annotated tag as a GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              core.info(`Release ${tagName} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tagName}` });
            let notes = `Release ${tagName}`;
            if (ref.data.object.type === 'tag') {
              const annotatedTag = await github.rest.git.getTag({ owner, repo, tag_sha: ref.data.object.sha });
              notes = annotatedTag.data.message;
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              name: tagName,
              body: notes,
              draft: false,
              prerelease: false,
              generate_release_notes: false
            });
