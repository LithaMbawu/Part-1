name: Publish tagged release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source and release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read annotated tag notes
        id: release-notes
        shell: bash
        run: |
          delimiter="$(openssl rand -hex 16)"
          {
            echo "body<<$delimiter"
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.release-notes.outputs.body }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
