name: Portfolio validation

on:
  push:
  pull_request:

jobs:
  test-chatbot:
    name: Build and test chatbot
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Run chatbot tests
        run: dotnet test docs/CybersecurityChatbot.slnx

      - name: Build all solution projects
        run: dotnet build docs/CybersecurityChatbot.slnx --no-restore

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/api-endpoint-plan.md
          test -f docs/raceday-erd.mmd
          test -f docs/raceday-erd-export.html
          test -f docs/raceday-erd.png
          test -f docs/raceday-schema.sql
          test -f docs/CybersecurityChatbot.slnx
          test -f docs/CybersecurityChatbot.Core/CybersecurityChatbot.Core.csproj
          test -f docs/CybersecurityChatbot.Core.Tests/CybersecurityChatbot.Core.Tests.csproj
          test -f docs/CybersecurityChatbot.Gui/CybersecurityChatbot.Gui.csproj

      - name: Validate ERD and SQL coverage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'USERS' docs/raceday-erd.mmd
          grep -q 'EVENTS' docs/raceday-erd.mmd
          grep -q 'CATEGORIES' docs/raceday-erd.mmd
          grep -q 'EVENT_CATEGORIES' docs/raceday-erd.mmd
          grep -q 'ENROLMENTS' docs/raceday-erd.mmd
          grep -q 'RESULTS' docs/raceday-erd.mmd
          grep -q 'CREATE TABLE dbo.Users' docs/raceday-schema.sql
          grep -q 'CREATE TABLE dbo.Events' docs/raceday-schema.sql
          grep -q 'CREATE TABLE dbo.Categories' docs/raceday-schema.sql
          grep -q 'CREATE TABLE dbo.EventCategories' docs/raceday-schema.sql
          grep -q 'CREATE TABLE dbo.Enrolments' docs/raceday-schema.sql
          grep -q 'CREATE TABLE dbo.Results' docs/raceday-schema.sql
          grep -q 'CreatedAt' docs/raceday-erd-export.html
          grep -q 'PK_Users' docs/raceday-schema.sql
          grep -q 'FK_Events_Organiser' docs/raceday-schema.sql
          grep -q 'FK_Enrolments_Event_Category' docs/raceday-schema.sql
          grep -q 'FK_Results_Enrolment' docs/raceday-schema.sql

      - name: Validate endpoint plan shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q '| HTTP Method | Route | Description | Role Required | Request Body (if any) | Expected Response |' docs/api-endpoint-plan.md
          test "$(grep -c '^| [A-Z]' docs/api-endpoint-plan.md)" -ge 20
          grep -q '## Route-specific failure cases' docs/api-endpoint-plan.md